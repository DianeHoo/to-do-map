<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do Map</title>
<meta property="og:title" content="To-Do Map | Sort your tasks, clear your mind.">
<meta property="og:description" content="All your maps in one place. Sort tasks by urgency and importance, or impact and effort.">
<meta property="og:image" content="https://todomap.live/preview.png">
<meta property="og:url" content="https://todomap.live/home/">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
}

:root {
  --canvas-bg: #fafaf5;
  --card-bg: #ffffff;
  --text: #2e342d;
  --text-dim: rgba(46, 52, 45, 0.58);
  --text-muted: rgba(46, 52, 45, 0.3);
  --text-ghost: rgba(46, 52, 45, 0.2);
  --sage: #526347;
  --sage-08: rgba(82, 99, 71, 0.08);
  --sage-15: rgba(82, 99, 71, 0.15);
  --sage-20: rgba(82, 99, 71, 0.20);
  --sage-25: rgba(82, 99, 71, 0.25);
  --sage-45: rgba(82, 99, 71, 0.55);
  --sage-interactive: rgba(82, 99, 71, 0.82);
  --sage-label: rgba(82, 99, 71, 0.68);
  --card-shadow: 0 1px 4px rgba(46, 52, 45, 0.05);
  --card-shadow-lift: 0 8px 24px rgba(46, 52, 45, 0.16);
  --radius: 12px;
  --font-display: 'Manrope', sans-serif;
  --font-body: 'Plus Jakarta Sans', sans-serif;
}

html, body {
  min-height: 100%;
  background: var(--canvas-bg);
  color: var(--text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; }

/* ── Page layout ── */
.home {
  width: min(1040px, 100% - 96px);
  margin: 0 auto;
  padding: 72px 0 96px;
}

.home-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 40px;
}

.home-header h1 {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--text);
}

.new-map-btn {
  border: none;
  background: var(--sage);
  color: var(--canvas-bg);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.01em;
  padding: 9px 18px;
  border-radius: 999px;
  cursor: pointer;
  box-shadow: 0 1px 4px rgba(46, 52, 45, 0.12);
  transition: background 150ms, box-shadow 150ms;
}
.new-map-btn:hover {
  background: #42513a;
  box-shadow: 0 4px 12px rgba(46, 52, 45, 0.18);
}
.new-map-btn:focus-visible {
  outline: 2px solid var(--sage);
  outline-offset: 4px;
}

/* ── Card grid ── */
.maps-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px;
}

@keyframes cardSlideIn {
  from { opacity: 0; transform: translateY(-8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.map-card {
  position: relative;
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--card-shadow);
  transition: box-shadow 180ms ease;
}
/* Only cards appearing for the first time animate in — re-renders (menu
   toggles, renames) rebuild the grid and must not replay the entrance. */
.map-card.is-new {
  animation: cardSlideIn 200ms ease-out both;
}
.map-card:hover {
  box-shadow: var(--card-shadow-lift);
}

/* Thumbnail */
.map-thumb {
  cursor: pointer;
  position: relative;
  height: 110px;
  margin: 10px 10px 0;
  border-radius: 8px;
  background: var(--canvas-bg);
  overflow: hidden;
}
.map-thumb .axis-v {
  position: absolute;
  left: 50%;
  top: 14%;
  bottom: 14%;
  width: 1px;
  background: var(--sage-20);
}
.map-thumb .axis-h {
  position: absolute;
  top: 50%;
  left: 9%;
  right: 9%;
  height: 1px;
  background: var(--sage-20);
}
.map-thumb .mini-card {
  position: absolute;
  height: 9px;
  border-radius: 3px;
  background: var(--card-bg);
  box-shadow: 0 1px 3px rgba(46, 52, 45, 0.10);
}
.map-thumb .mini-card.done { opacity: 0.4; }
.map-kind-tag {
  position: absolute;
  top: 8px;
  right: 8px;
  font-family: var(--font-display);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.03em;
  color: var(--sage-label);
  background: var(--card-bg);
  border-radius: 999px;
  padding: 3px 8px;
  box-shadow: 0 1px 3px rgba(46, 52, 45, 0.08);
}

/* Title row */
.map-title-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 12px 16px 14px;
}
.map-title {
  flex: 1;
  min-width: 0;
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  cursor: pointer;
  line-height: 1.4;
  overflow-wrap: break-word;
}
.map-rename-input {
  flex: 1;
  min-width: 0;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  border: none;
  border-bottom: 1px solid var(--sage-15);
  background: transparent;
  padding: 2px 0;
  outline: none;
  caret-color: var(--sage);
}
.map-count {
  flex: none;
  font-family: var(--font-display);
  font-size: 11px;
  color: var(--text-muted);
  line-height: 19.6px;
}
.map-menu-btn {
  border: none;
  background: none;
  color: var(--sage-25);
  font-size: 15px;
  line-height: 19.6px;
  padding: 0 6px;
  border-radius: 4px;
  cursor: pointer;
  flex: none;
  transition: color 150ms;
}
.map-menu-btn:hover { color: var(--sage); }

/* ⋯ dropdown menu */
.map-menu {
  position: absolute;
  bottom: 44px;
  right: 12px;
  z-index: 10;
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--card-shadow-lift);
  padding: 6px;
  display: flex;
  flex-direction: column;
  min-width: 130px;
}
.map-menu button {
  text-align: left;
  border: none;
  background: none;
  font-family: var(--font-body);
  font-size: 13px;
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
  color: var(--sage-interactive);
}
.map-menu button:hover {
  background: var(--sage-08);
  color: var(--sage);
}
.map-menu button.menu-delete { color: var(--text-dim); }
.map-menu button.menu-delete:hover {
  background: rgba(46, 52, 45, 0.06);
  color: var(--text);
}

/* New-map tile */
.new-map-tile {
  min-height: 174px;
  border: 1px dashed var(--sage-25);
  border-radius: var(--radius);
  background: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--sage-45);
  transition: color 150ms, border-color 150ms;
}
.new-map-tile:hover {
  color: var(--sage);
  border-color: var(--sage-45);
}
.new-map-tile span {
  font-size: 22px;
  font-weight: 300;
  line-height: 1;
}

/* Empty state */
.empty-state {
  margin: 56px 0 0;
  text-align: center;
  font-family: var(--font-display);
  font-size: 14px;
  color: var(--text-muted);
  line-height: 1.6;
}

/* ── New-map picker (modal) ── */
.kind-picker-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(46, 52, 45, 0.2);
  display: flex;
  align-items: center;
  justify-content: center;
}
.kind-picker-overlay[hidden] { display: none; }
.kind-picker-panel {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--card-shadow-lift);
  padding: 24px;
  display: flex;
  gap: 12px;
}
.kind-option {
  border: 1px solid var(--sage-15);
  background: none;
  border-radius: var(--radius);
  padding: 18px 20px;
  cursor: pointer;
  font-family: var(--font-body);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  width: 150px;
  transition: border-color 150ms, background 150ms;
}
.kind-option:hover {
  border-color: var(--sage-45);
  background: var(--sage-08);
}
.kind-option span {
  font-size: 13px;
  color: var(--text);
}
.kind-option.kind-import {
  border-style: dashed;
  border-color: var(--sage-25);
  justify-content: center;
}
.kind-option.kind-import span { color: var(--text-dim); }

@media (max-width: 560px) {
  .home { width: min(1040px, 100% - 48px); }
  .kind-picker-panel { flex-direction: column; }
}

/* ── Account (sign-in) ── */
.home-header-actions {
  display: flex;
  align-items: center;
  gap: 20px;
}
.auth-link {
  border: none;
  background: none;
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--sage-interactive);
  cursor: pointer;
  padding: 0;
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  transition: color 150ms;
}
.auth-link:hover { color: var(--sage); }

/* Sync status — quiet when everything works, one short line when it doesn't */
.sync-status {
  margin: -32px 0 24px;
  text-align: right;
  font-size: 12px;
  color: var(--text-dim);
}
.sync-status button {
  border: none;
  background: none;
  font: inherit;
  color: var(--sage-interactive);
  cursor: pointer;
  padding: 0;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.sync-status button:hover { color: var(--sage); }

.auth-panel {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--card-shadow-lift);
  padding: 24px;
  width: min(320px, calc(100vw - 48px));
}
.auth-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  overflow-wrap: break-word;
}
.auth-note {
  margin-top: 8px;
  font-size: 13px;
  line-height: 1.5;
  color: var(--text-dim);
}
.auth-status { color: var(--sage-interactive); }
.auth-input {
  display: block;
  width: 100%;
  margin-top: 16px;
  font-family: var(--font-body);
  font-size: 14px;
  color: var(--text);
  border: none;
  border-bottom: 1px solid var(--sage-15);
  background: transparent;
  padding: 6px 0;
  outline: none;
  caret-color: var(--sage);
}
.auth-input:focus { border-bottom-color: var(--sage-45); }
.auth-input::placeholder { color: var(--text-ghost); }
#auth-send { margin-top: 18px; }
.auth-textbtn {
  margin-top: 16px;
  border: none;
  background: none;
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--text-dim);
  cursor: pointer;
  padding: 0;
  transition: color 150ms;
}
.auth-textbtn:hover { color: var(--text); }
.auth-dot {
  display: block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--sage);
  opacity: 0.75;
  margin-bottom: 10px;
}
.auth-substat {
  margin-top: 6px;
  font-size: 11px;
  color: var(--text-muted);
}
.auth-links { margin-top: 16px; }
.auth-textbtn.auth-inline { margin-top: 0; font-size: 11px; color: var(--sage-interactive); }
.auth-textbtn.auth-inline:hover { color: var(--sage); }
.auth-sep { color: var(--text-ghost); margin: 0 8px; font-size: 11px; }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  background: var(--card-bg);
  border-radius: 999px;
  box-shadow: var(--card-shadow-lift);
  padding: 10px 18px;
  font-size: 13px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 12px;
  animation: cardSlideIn 200ms ease-out both;
}
.toast[hidden] { display: none; }
.toast button {
  border: none;
  background: none;
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--sage-interactive);
  cursor: pointer;
  padding: 0;
}
.toast button:hover { color: var(--sage); }
</style>
</head>
<body>

<main class="home">
  <div class="home-header">
    <h1>To-Do Map</h1>
    <div class="home-header-actions">
      <button id="auth-link" class="auth-link" type="button" hidden>sign in</button>
      <button id="btn-new-map" class="new-map-btn" type="button">+ new map</button>
    </div>
  </div>

  <p id="sync-status" class="sync-status" role="status" hidden></p>

  <div id="maps-grid" class="maps-grid"></div>

  <p id="empty-state" class="empty-state" hidden>Nothing here yet.</p>
</main>

<div id="kind-picker" class="kind-picker-overlay" hidden>
  <div class="kind-picker-panel" role="dialog" aria-label="Create a new map">
    <button class="kind-option" type="button" data-kind="urgency-importance">
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><line x1="22" y1="6" x2="22" y2="38" stroke="rgba(82,99,71,0.35)" stroke-width="1.5"></line><line x1="6" y1="22" x2="38" y2="22" stroke="rgba(82,99,71,0.35)" stroke-width="1.5"></line><rect x="26" y="9" width="9" height="5" rx="2" fill="#526347"></rect><rect x="9" y="12" width="9" height="5" rx="2" fill="rgba(82,99,71,0.45)"></rect><rect x="27" y="28" width="9" height="5" rx="2" fill="rgba(82,99,71,0.45)"></rect></svg>
      <span>urgency × importance</span>
    </button>
    <button class="kind-option" type="button" data-kind="impact-effort">
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><line x1="22" y1="6" x2="22" y2="38" stroke="rgba(82,99,71,0.35)" stroke-width="1.5"></line><line x1="6" y1="22" x2="38" y2="22" stroke="rgba(82,99,71,0.35)" stroke-width="1.5"></line><circle cx="13" cy="13" r="5" fill="#526347"></circle><circle cx="31" cy="31" r="3.5" fill="rgba(82,99,71,0.35)"></circle></svg>
      <span>impact × effort</span>
    </button>
    <button id="btn-import" class="kind-option kind-import" type="button">
      <svg width="44" height="44" viewBox="0 0 44 44" fill="none" aria-hidden="true"><path d="M14 20 L22 12 L30 20" stroke="rgba(82,99,71,0.55)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><line x1="22" y1="12" x2="22" y2="30" stroke="rgba(82,99,71,0.55)" stroke-width="1.5" stroke-linecap="round"></line><line x1="12" y1="35" x2="32" y2="35" stroke="rgba(82,99,71,0.35)" stroke-width="1.5" stroke-linecap="round"></line></svg>
      <span>import from file</span>
    </button>
  </div>
</div>

<div id="auth-modal" class="kind-picker-overlay" hidden>
  <div class="auth-panel" role="dialog" aria-label="Account">
    <div id="auth-signedout">
      <p class="auth-title">sync your maps across devices</p>
      <input id="auth-email" class="auth-input" type="email" autocomplete="email" placeholder="you@example.com" aria-label="email address">
      <button id="auth-send" class="new-map-btn" type="button">send link</button>
      <p id="auth-status" class="auth-note auth-status" hidden></p>
    </div>
    <div id="auth-sent" hidden>
      <span class="auth-dot" aria-hidden="true"></span>
      <p class="auth-title">check your inbox</p>
      <p class="auth-note" id="auth-sent-email"></p>
      <p class="auth-links"><button id="auth-resend" class="auth-textbtn auth-inline" type="button">resend</button><span class="auth-sep" aria-hidden="true">·</span><button id="auth-change-email" class="auth-textbtn auth-inline" type="button">use a different email</button></p>
    </div>
    <div id="auth-signedin" hidden>
      <p class="auth-title" id="auth-user-email"></p>
      <p class="auth-substat">maps sync to this account</p>
      <button id="auth-signout" class="auth-textbtn" type="button">sign out</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden>
  <span id="toast-msg"></span>
  <button id="toast-action" type="button" hidden></button>
</div>

<input type="file" id="import-input" accept=".json,application/json" class="sr-only" tabindex="-1">
<div class="sr-only" role="status" aria-live="polite" id="announcer"></div>

<script src="../share-config.js"></script>
<script src="../share.js"></script>
<script src="../maps-index.js"></script>
<script src="../maps-cloud.js"></script>
<script src="home.js"></script>
</body>
</html>
